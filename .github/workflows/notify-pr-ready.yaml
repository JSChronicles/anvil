name: pr-notify

on:
  workflow_run:
    workflows:
      - Dependabot auto-update
      - Python Tests
      - Ruff
      - Validate YAML Schema
      - CodeQL Advanced
    types: [completed]

  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to check (for testing)"
        required: false

concurrency:
  group: pr-notify-${{ github.event.workflow_run.head_sha || github.event.inputs.sha || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  pr-notify:
    name: pr-notify
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate PR notification state
        id: notify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = "slack-notified";
            const sha =
              context.eventName === "workflow_run"
                ? context.payload.workflow_run.head_sha
                : "${{ github.event.inputs.sha }}";

            if (!sha) {
              core.setFailed("No SHA was provided.");
              return;
            }

            const prs = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
                per_page: 100
              }
            );
            const pr = prs.find((candidate) => candidate.state === "open");

            if (!pr) {
              console.log(`No open PR found for ${sha}.`);
              core.setOutput("should_notify", "false");
              return;
            }

            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100
            });
            const alreadyNotified = labels.some((candidate) => candidate.name === label);
            if (alreadyNotified) {
              console.log(`PR #${pr.number} already has ${label}.`);
              core.setOutput("should_notify", "false");
              return;
            }

            const [checksResp, statusesResp] = await Promise.all([
              github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha
              }),
              github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha
              })
            ]);

            const ignoredChecks = new Set(["Evaluate PR notification state"]);
            const checkRuns = checksResp.data.check_runs.filter(
              (run) => !ignoredChecks.has(run.name)
            );
            const statusContexts = statusesResp.data.statuses;
            const total = checkRuns.length + statusContexts.length;
            const pendingChecks = checkRuns.filter((run) => run.status !== "completed");
            const pendingStatuses = statusContexts.filter((status) => status.state === "pending");

            if (pendingChecks.length > 0 || pendingStatuses.length > 0) {
              console.log(
                `Checks are still pending for PR #${pr.number}: ` +
                  `${pendingChecks.length + pendingStatuses.length}/${total}`
              );
              core.setOutput("should_notify", "false");
              return;
            }

            const failedChecks = checkRuns.filter(
              (run) => !["success", "neutral", "skipped"].includes(run.conclusion)
            );
            const failedStatuses = statusContexts.filter((status) => status.state !== "success");
            const failed = failedChecks.length + failedStatuses.length;
            const passed = total - failed;
            const isDependabot = pr.user.login === "dependabot[bot]";
            const isAutoManagedDependabot = isDependabot
              ? await dependabotAutoMergeWasAttempted(sha)
              : false;

            let shouldNotify;
            let title;

            if (isAutoManagedDependabot) {
              shouldNotify = failed > 0;
              title = "Dependabot auto-managed PR has failing checks";
            } else {
              shouldNotify = failed === 0;
              title = "Pull Request is ready to merge";
            }

            core.setOutput("should_notify", shouldNotify ? "true" : "false");
            core.setOutput("title", title);
            core.setOutput("pr_number", String(pr.number));
            core.setOutput("pr_url", pr.html_url);
            core.setOutput("pr_head_ref", pr.head.ref);
            core.setOutput("pr_base_ref", pr.base.ref);
            core.setOutput("pr_author", pr.user.login);
            core.setOutput("check_summary", `${passed}/${total} checks passed`);

            console.log(`PR #${pr.number}`);
            console.log(`author=${pr.user.login}`);
            console.log(`isAutoManagedDependabot=${isAutoManagedDependabot}`);
            console.log(`checkSummary=${passed}/${total}`);
            console.log(`shouldNotify=${shouldNotify}`);

            async function dependabotAutoMergeWasAttempted(headSha) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "dependabot-auto-update.yaml",
                event: "pull_request",
                head_sha: headSha,
                per_page: 100
              });
              const run = runs
                .filter((candidate) => candidate.head_sha === headSha)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

              if (!run || run.status !== "completed") {
                console.log("Dependabot auto-update has not completed for this SHA.");
                return false;
              }

              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100
              });

              const autoUpdateStepNames = new Set([
                "Approve pull request",
                "Enable auto-merge"
              ]);

              return jobs.some((job) =>
                job.steps?.some(
                  (step) =>
                    autoUpdateStepNames.has(step.name) &&
                    step.conclusion &&
                    step.conclusion !== "skipped"
                )
              );
            }

