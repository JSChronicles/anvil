name: "Publish"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.19.1"
        required: false
        type: string

  workflow_call:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.19.1"
        required: true
        type: string


jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Build
        run: uv build

      - name: Smoke test wheel
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::expected exactly one wheel in dist, found ${#wheels[@]}"
            exit 1
          fi

          uv run --isolated --no-project --python 3.14 --with "${wheels[0]}" \
            anvil --version
          uv run --isolated --no-project --python 3.14 --with "${wheels[0]}" \
            anvil validate --quiet --config-file yaml/noop.yaml

      # - name: Smoke test (source distribution)
      #   run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py

      - name: Publish
        run: uv publish
