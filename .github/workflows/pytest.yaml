name: Python Tests

permissions:
  contents: read

on:
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install the project
        run: uv sync --all-extras --all-groups

      - name: Build package
        run: uv build

      - name: Smoke test CLI entrypoint
        run: |
          uv run anvil --help
          uv run anvil list --tasks
          uv run anvil list --processors
          uv run anvil validate --tasks
          uv run anvil validate --processors

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

      - name: Run tests with coverage
        run: uv run pytest --cov
