name: Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-release:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: false
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pin release branch to workflow SHA
        run: git reset --hard ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Tag semantic release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UV_CACHE_DIR: ./.uv-cache
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          uvx --from python-semantic-release==10.5.3 semantic-release version
          tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)"
          if [ -n "$tag" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release summary
        run: |
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "Released ${{ steps.release.outputs.tag }}"
          else
            echo "No release generated from this push"
          fi
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      tag: ${{ steps.release.outputs.tag }}

  publish:
    needs: tag-release
    if: needs.tag-release.outputs.released == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yaml
    with:
      tag: ${{ needs.tag-release.outputs.tag }}
