name: Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-release:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: false
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Create release bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PYTHON_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PYTHON_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pin release branch to workflow SHA
        run: git reset --hard ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Verify release baseline tag
        run: |
          if ! git tag --list 'v*' | grep -q .; then
            current_version="$(uv version --short)"
            echo "::error::No v* release tags exist. Create baseline tag v${current_version} on the current release commit before enabling semantic-release."
            exit 1
          fi

      - name: Tag semantic release
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_COMMIT_AUTHOR: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          UV_CACHE_DIR: ./.uv-cache
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          uvx --from python-semantic-release==10.5.3 semantic-release version
          tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)"
          if [ -n "$tag" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release summary
        run: |
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "Released ${{ steps.release.outputs.tag }}"
          else
            echo "No release generated from this push"
          fi
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      tag: ${{ steps.release.outputs.tag }}

  publish:
    needs: tag-release
    if: needs.tag-release.outputs.released == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yaml
    with:
      tag: ${{ needs.tag-release.outputs.tag }}

  publish-container:
    needs: tag-release
    if: needs.tag-release.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yaml
    with:
      tag: ${{ needs.tag-release.outputs.tag }}
      push: true
      platforms: linux/amd64,linux/arm64
