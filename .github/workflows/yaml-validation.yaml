name: Validate YAML Schema

on:
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

  workflow_dispatch:

jobs:
  validate-yaml:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"

      - name: Install the project
        run: uv sync --all-groups

      - name: Validate YAML
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          import yaml

          from anvil.validators import validate_config_schema

          patterns = (
              "yaml/*.yaml",
              "yaml/*.yml",
              "examples/*.yaml",
              "examples/*.yml",
          )

          config_paths = sorted(
              {path for pattern in patterns for path in Path(".").glob(pattern)}
          )

          for config_path in config_paths:
              with config_path.open("r", encoding="utf-8") as handle:
                  config = yaml.safe_load(handle) or {}

              validate_config_schema(config=config)
              print(f"validated {config_path}")
          PY
