[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[project]
name = "anvil"
version = "0.20.0"
description = "Anvil is a multi-org AWS execution runner"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "boto3",
  "requests",
  "PyYAML>=6.0.3",
  "jsonschema>=4.26.0"
]

[project.scripts]
anvil = "anvil.cli:main"

[dependency-groups]
dev = [
  "pytest-cov==7.1.0",
  "pytest==9.0.3",
  "prek==0.3.8",
  "check-jsonschema",
  "ruff"
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-s -v --cov=anvil --cov-report=term-missing --cov-fail-under=50"
norecursedirs = [".git", "__pycache__", ".venv"]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "src/anvil/tasks/*",
]

[tool.semantic_release]
allow_zero_version = true
assets = ["uv.lock"]
build_command = "uv lock"
commit_message = "chore(release): v{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
major_on_zero = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"
template_dir = ".semantic_release/changelog_templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"


[tool.ruff]
# https://docs.astral.sh/ruff/settings/
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["N", "E4", "E7", "E9", "F"]
ignore = []
task-tags = ["TODO", "FIXME", "HACK"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
