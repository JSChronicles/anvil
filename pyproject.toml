[build-system]
requires = ["uv_build>=0.11.24,<0.14"]
build-backend = "uv_build"

[project]
name = "anvil"
version = "0.31.0"
description = "Provider-aware cloud task runner for schema v2 multi-cloud targets"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
  { name = "JSChronicles" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = [
  "boto3>=1.43.36,<1.50.0",
  "PyYAML>=6.0.3,<7.0.0",
  "jsonschema>=4.26.0,<4.30.0"
]

[project.optional-dependencies]
all = [
  "anvil[azure]",
  "anvil[cloudflare]",
  "anvil[datadog]",
  "anvil[gcp]",
  "anvil[github]",
  "anvil[gitlab]",
  "anvil[pagerduty]",
]
azure = [
  "azure-identity",
  "azure-keyvault-secrets",
  "azure-mgmt-authorization",
  "azure-mgmt-compute",
  "azure-mgmt-keyvault",
  "azure-mgmt-monitor",
  "azure-mgmt-network",
  "azure-mgmt-resource",
  "azure-mgmt-resource-subscriptions",
  "azure-mgmt-resourcegraph",
  "azure-mgmt-storage",
  "azure-mgmt-subscription",
]
cloudflare = [
  "cloudflare>=5.6.0,<6.0.0",
]
datadog = [
  "datadog-api-client>=2.58.0,<3.0.0",
]
gcp = [
  "google-auth",
  "google-cloud-asset",
  "google-cloud-compute",
  "google-cloud-container",
  "google-cloud-iam",
  "google-cloud-logging",
  "google-cloud-monitoring",
  "google-cloud-resource-manager",
  "google-cloud-storage",
]
github = [
  "PyGithub>=2.9.1,<3.0.0",
]
gitlab = [
  "python-gitlab>=8.5.0,<9.0.0",
]
pagerduty = [
  "pagerduty>=7.0.0,<8.0.0",
]

[project.urls]
Homepage = "https://github.com/JSChronicles/anvil"
Repository = "https://github.com/JSChronicles/anvil"
Issues = "https://github.com/JSChronicles/anvil/issues"
Documentation = "https://opsfoundry.dev/anvil/"

[project.scripts]
anvil = "anvil.cli:main"

[dependency-groups]
dev = [
  "pytest-cov>=7.1.0,<8.0.0",
  "pytest>=9.1.1,<10.0.0",
  "prek>=0.4.12,<0.5.0",
  "check-jsonschema>=0.37.3,<0.40.0",
  "ruff>=0.16.0,<0.20.0",
  "ty>=0.0.60,<0.20.0",
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-s -v --cov=anvil --cov-report=term-missing --cov-fail-under=50"
norecursedirs = [".git", "__pycache__", ".venv"]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "src/anvil/providers/tasks/*",
]

# Keep release assets empty; update and stage uv.lock without uploading it.
[tool.semantic_release]
allow_zero_version = true
build_command = """
uv lock --upgrade-package anvil
git add uv.lock
"""
commit_message = "chore(release): v{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
major_on_zero = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"
template_dir = ".semantic_release/changelog_templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"


[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["N", "E4", "E7", "E9", "F"]
task-tags = ["TODO", "FIXME", "HACK"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ty.analysis]
# Cloud SDKs are imported lazily from optional extras. Matplotlib is used only
# by the optional benchmark chart generator.
allowed-unresolved-imports = [
  "azure.**",
  "cloudflare",
  "datadog_api_client.**",
  "github",
  "gitlab",
  "google.**",
  "pagerduty",
  "matplotlib.**",
]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
# Tests intentionally use lightweight structural doubles and heterogeneous
# dictionaries instead of constructing third-party SDK and runtime objects.
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"
invalid-assignment = "ignore"

[tool.uv]
exclude-newer = "1 week"
