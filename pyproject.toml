[build-system]
requires = ["uv_build>=0.11.16,<0.14"]
build-backend = "uv_build"

[project]
name = "anvil"
version = "0.28.2"
description = "Anvil is a multi-org AWS execution runner"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
  { name = "JSChronicles" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = [
  "boto3>=1.43.14,<1.50.0",
  "PyYAML>=6.0.3,<7.0.0",
  "jsonschema>=4.26.0,<4.30.0"
]

[project.urls]
Homepage = "https://github.com/JSChronicles/anvil"
Repository = "https://github.com/JSChronicles/anvil"
Issues = "https://github.com/JSChronicles/anvil/issues"
Documentation = "https://github.com/JSChronicles/anvil#readme"

[project.scripts]
anvil = "anvil.cli:main"

[dependency-groups]
dev = [
  "pytest-cov>=7.1.0,<8.0.0",
  "pytest>=9.0.3,<10.0.0",
  "prek>=0.4.2,<0.5.0",
  "check-jsonschema>=0.37.2,<0.40.0",
  "ruff>=0.15.14,<0.20.0",
  "ty>=0.0.40,<0.20.0",
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-s -v --cov=anvil --cov-report=term-missing --cov-fail-under=50"
norecursedirs = [".git", "__pycache__", ".venv"]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "src/anvil/tasks/*",
]

# Keep release assets empty; update and stage uv.lock without uploading it.
[tool.semantic_release]
allow_zero_version = true
build_command = """
uv lock --upgrade-package anvil
git add uv.lock
"""
commit_message = "chore(release): v{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
major_on_zero = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"
template_dir = ".semantic_release/changelog_templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"


[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["N", "E4", "E7", "E9", "F"]
task-tags = ["TODO", "FIXME", "HACK"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.uv]
exclude-newer = "1 week"
