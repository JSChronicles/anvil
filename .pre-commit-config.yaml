repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 856f55170f70dc7523c45a215ecdedc44709e2a6 # 0.12.6
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: aab412d509121cb5f7533134b7e67f9fab59c682 # v0.16.4
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
