repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 8d582f54b8e4cc5a61a85eeed1f54bbdb1e294fc # 0.12.3
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 7c55798a78262d14b2074abf623d8a992ebb70d4 # v0.16.2
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
