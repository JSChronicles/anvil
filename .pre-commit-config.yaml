repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: dd409d04a3fa4a50f918dddb3ad3c6d8f46ab2cd # 0.13.4
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # v0.17.1
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
