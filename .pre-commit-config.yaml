repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 5900cba2cfe6d20f562458d4d308ac55569f92eb # 0.12.0
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # v0.16.0
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
