repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: d153933366256874470b9d8395de436c50714f41 # 0.12.9
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 1f1e8bf348ff38fc88619a38d3ca4d9c56abea49 # v0.16.5
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
