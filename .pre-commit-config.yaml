repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 46787482b9fb2003c56e0f7592e312ef381829d9 # 0.13.6
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # v0.17.3
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
