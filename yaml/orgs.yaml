schema_version: 2
targets:
  - name: org1
    provider:
      name: aws
      mode: organization
      options:
        profile: root1
    regions:
      - us-east-1
    tasks:
      - name: discover
      - name: remove_iam_user
        depends_on: ["discover"]
    dry_run: true
    max_workers: 5
    metadata:
      users: [migration]
  - name: org2
    provider:
      name: aws
      mode: organization
      options:
        profile: root2
    regions:
      - us-east-1
    tasks:
      - name: remove_iam_user
    dry_run: true
    max_workers: 5
    metadata:
      users: [migration]
