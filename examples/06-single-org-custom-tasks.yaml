# Demonstrates:
# - Explicit task configuration
# - Task ordering via depends_on
# - Optional task behavior
# - Explicit single-region configuration
#
# Builds on 05 by making one task optional.

schema_version: 1

organizations:
  - name: task-org

    profile: my-aws-profile

    regions:
      - us-east-1

    exclude:
      - "333333333333"
      - "444444444444"

    tasks:
      - name: inventory
        # Runs first and gathers account state

      - name: tagging
        depends_on: ["inventory"]
        # Runs only if inventory succeeds

      - name: reporting
        depends_on: ["tagging"]
        optional: true
        # Failure does not fail the account
