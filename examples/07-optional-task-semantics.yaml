schema_version: 2
targets:
- name: optional-semantics-org
  provider:
    name: aws
    mode: organization
    options:
      profile: my-aws-profile
  regions:
  - us-east-1
  exclude:
  - '333333333333'
  - '444444444444'
  tasks:
  - name: inventory
  - name: reporting
    depends_on:
    - inventory
    optional: true
  - name: cleanup
    depends_on:
    - reporting
