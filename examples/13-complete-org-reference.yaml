schema_version: 1
max_parallel_targets: 2

organizations:
  - name: place
    profile: place-root
    # Organizations support explicit regions, all by itself, glob selectors,
    # and mixed glob plus explicit selectors.
    # Delegated administrator workflows can set assume_role_in_management: true
    # to make the management/payer account assume role_name just like member
    # accounts. The role must exist in all member accounts and in the
    # management/payer account.
    regions:
      - us-east-1
      - us-west-2
    role_name: OrganizationAccountAccessRole

    max_workers: 5
    max_parallel_regions: 2
    fail_fast: false
    dry_run: true

    include:
      - "111111111111"
      - "222222222222"

    tasks:
      - name: discover_iam_users

      - name: backup_iam_users
        depends_on:
          - discover_iam_users

      - name: remove_iam_user
        depends_on:
          - discover_iam_users
          - backup_iam_users

    metadata:
      user_name: test

    # Post-run processors run only after this organization target completes
    # successfully. Processor names are discovered from installed Anvil
    # processor plugins.
    post_run:
      - processor: summary_markdown
        output: reports/place-summary.md
        metadata:
          include_passed: false

  - name: audit
    profile: audit-root
    # Example alternatives:
    # regions: [all]
    # regions: [us-*]
    # regions: [us-*, ca-central-1]
    regions:
      - us-west-2
    role_name: OrganizationAccountAccessRole

    max_workers: 10
    max_parallel_regions: 1
    fail_fast: true
    dry_run: false

    exclude:
      - "333333333333"

    tasks:
      - name: inventory_resources

      - name: validate_security_baseline
        depends_on:
          - inventory_resources

      - name: report_findings
        depends_on:
          - inventory_resources
          - validate_security_baseline
        optional: true

    metadata:
      owner: security

    post_run:
      - processor: summary_json
        output: reports/audit-summary.json
