schema_version: 2
max_parallel_targets: 2
targets:
- name: explicit-regions
  provider:
    name: aws
    mode: organization
    options:
      profile: org-root
      role_name: OrganizationAccountAccessRole
  regions:
  - us-east-1
  - us-west-2
  tasks:
  - name: noop
- name: all-enabled-regions
  provider:
    name: aws
    mode: organization
    options:
      profile: org-root
      role_name: OrganizationAccountAccessRole
  regions:
  - all
  tasks:
  - name: noop
- name: broad-region-glob
  provider:
    name: aws
    mode: organization
    options:
      profile: org-root
      role_name: OrganizationAccountAccessRole
  regions:
  - us-*
  tasks:
  - name: noop
- name: narrow-region-glob
  provider:
    name: aws
    mode: organization
    options:
      profile: org-root
      role_name: OrganizationAccountAccessRole
  regions:
  - us-*-1
  tasks:
  - name: noop
- name: mixed-glob-and-explicit-regions
  provider:
    name: aws
    mode: organization
    options:
      profile: org-root
      role_name: OrganizationAccountAccessRole
  regions:
  - us-*
  - ca-central-1
  tasks:
  - name: noop
