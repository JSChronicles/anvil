# Demonstrates:
# - Restricting execution to specific AWS account IDs
# - Explicit single-region configuration
#
# Builds on 02 by adding include filtering.

schema_version: 1

organizations:
  - name: include-only-org

    profile: my-aws-profile

    regions:
      - us-east-1

    include:
      - "111111111111"
      - "222222222222"
    # Only these accounts are executed; all others are ignored.
