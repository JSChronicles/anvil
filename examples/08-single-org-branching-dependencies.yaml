schema_version: 2
targets:
- name: branching-task-org
  provider:
    name: aws
    mode: organization
    options:
      profile: my-aws-profile
  regions:
  - us-east-1
  exclude:
  - '333333333333'
  - '444444444444'
  tasks:
  - name: inventory
  - name: tagging
    depends_on:
    - inventory
  - name: compliance
    depends_on:
    - inventory
    optional: true
  - name: cleanup
    depends_on:
    - tagging
    - compliance
