# Demonstrates:
# - Branching dependency graph
# - Multiple tasks depending on a shared prerequisite
# - Explicit single-region configuration
#
# Builds on 07 by expanding from a single branch to a fan-out/fan-in graph.

schema_version: 1

organizations:
  - name: branching-task-org

    profile: my-aws-profile

    regions:
      - us-east-1

    exclude:
      - "333333333333"
      - "444444444444"

    tasks:
      - name: inventory
        # Root task

      - name: tagging
        depends_on: ["inventory"]

      - name: compliance
        depends_on: ["inventory"]
        optional: true

      - name: cleanup
        depends_on: ["tagging", "compliance"]
