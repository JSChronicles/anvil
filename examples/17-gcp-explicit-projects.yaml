schema_version: 1

accounts:
  - name: gcp-explicit-projects
    provider: gcp
    mode: projects
    # GCP currently supports explicit project IDs and universal tasks only.
    # Runtime requires GCP optional SDKs and credentials.
    regions:
      - us-central1
    include:
      # GCP currently supports explicit project IDs only. Organization and
      # folder discovery are intentionally deferred.
      - anvil-dev-project
      - anvil-prod-project
    provider_options:
      credentials_path: /secure/path/to/credentials.json
      quota_project_id: anvil-billing-project
    dry_run: true
    tasks:
      - name: noop
