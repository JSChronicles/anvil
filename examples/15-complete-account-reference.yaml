schema_version: 1
max_parallel_targets: 2

accounts:
  - name: app-team
    profile: team-base
    # Account configs require explicit region names.
    regions:
      - us-east-1
    role_name: TeamExecutionRole
    include:
      - "333333333333"
      - "444444444444"
    tasks:
      - name: noop
    max_workers: 10
    max_parallel_regions: 1
    fail_fast: false
    dry_run: false
    metadata:
      owner: app-team
      environment: production
    # Post-run processors run only after this account target completes
    # successfully. Processor names are discovered from installed Anvil
    # processor plugins.
    post_run:
      - processor: summary_markdown
        output: reports/app-team-summary.md
        metadata:
          include_passed: true
