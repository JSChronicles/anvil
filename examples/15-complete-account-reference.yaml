schema_version: 2
max_parallel_targets: 2
targets:
- name: app-team
  provider:
    name: aws
    mode: accounts
    options:
      profile: team-base
      role_name: TeamExecutionRole
  regions:
  - us-east-1
  include:
  - '333333333333'
  - '444444444444'
  tasks:
  - name: noop
  max_workers: 10
  max_parallel_regions: 1
  fail_fast: false
  dry_run: false
  metadata:
    owner: app-team
    environment: production
  post_run:
  - processor: summary_markdown
    output: reports/app-team-summary.md
    metadata:
      include_passed: true
