schema_version: 2
max_parallel_targets: 2
targets:
- name: place
  provider:
    name: aws
    mode: organization
    options:
      profile: place-root
      role_name: OrganizationAccountAccessRole
  regions:
  - us-east-1
  - us-west-2
  max_workers: 5
  max_parallel_regions: 2
  fail_fast: false
  dry_run: true
  include:
  - '111111111111'
  - '222222222222'
  tasks:
  - name: discover_iam_users
  - name: backup_iam_users
    depends_on:
    - discover_iam_users
  - name: remove_iam_user
    depends_on:
    - discover_iam_users
    - backup_iam_users
  metadata:
    user_name: test
  post_run:
  - processor: summary_markdown
    output: reports/place-summary.md
    metadata:
      include_passed: false
- name: audit
  provider:
    name: aws
    mode: organization
    options:
      profile: audit-root
      role_name: OrganizationAccountAccessRole
  regions:
  - us-west-2
  max_workers: 10
  max_parallel_regions: 1
  fail_fast: true
  dry_run: false
  exclude:
  - '333333333333'
  tasks:
  - name: inventory_resources
  - name: validate_security_baseline
    depends_on:
    - inventory_resources
  - name: report_findings
    depends_on:
    - inventory_resources
    - validate_security_baseline
    optional: true
  metadata:
    owner: security
  post_run:
  - processor: summary_json
    output: reports/audit-summary.json
