schema_version: 1
max_parallel_targets: 2

organizations:
  - name: place
    profile: place-root
    # Organization region selectors support these forms:
    # - Explicit region list: [us-east-1, us-west-2]
    # - Special all selector by itself: [all]
    # - Broad glob selector: [us-*]
    # - Narrow glob selector: [us-*-1]
    # - Mixed glob plus explicit selectors: [us-*, ca-central-1]
    # The special all selector must be lowercase and cannot be mixed with
    # other region values.
    # Anvil uses the base-session account directly when it appears in
    # Organizations discovery, and assumes role_name in every other selected
    # account.
    regions:
      - us-east-1
      - us-west-2
    role_name: OrganizationAccountAccessRole

    max_workers: 5
    max_parallel_regions: 2
    fail_fast: false
    dry_run: true

    include:
      - "111111111111"
      - "222222222222"

    tasks:
      - name: discover_iam_users

      - name: backup_iam_users
        depends_on:
          - discover_iam_users

      - name: remove_iam_user
        depends_on:
          - discover_iam_users
          - backup_iam_users

    metadata:
      user_name: test

    # Post-run processors run only after this organization target completes
    # successfully. Processor names are discovered from installed Anvil
    # processor plugins.
    post_run:
      - processor: summary_markdown
        output: reports/place-summary.md
        metadata:
          include_passed: false

  - name: audit
    profile: audit-root
    # Example alternatives:
    # regions: [us-east-1, us-west-2]
    # regions: [all]
    # regions: [us-*]
    # regions: [us-*-1]
    # regions: [us-*, ca-central-1]
    regions:
      - us-west-2
    role_name: OrganizationAccountAccessRole

    max_workers: 10
    max_parallel_regions: 1
    fail_fast: true
    dry_run: false

    exclude:
      - "333333333333"

    tasks:
      - name: inventory_resources

      - name: validate_security_baseline
        depends_on:
          - inventory_resources

      - name: report_findings
        depends_on:
          - inventory_resources
          - validate_security_baseline
        optional: true

    metadata:
      owner: security

    post_run:
      - processor: summary_json
        output: reports/audit-summary.json
