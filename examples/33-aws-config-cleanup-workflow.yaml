schema_version: 2
max_parallel_targets: 2

# These component names illustrate tasks supplied by an AWS task plugin.
# Their modules declare scope; scope is never configured in YAML:
# - snapshot_org_config and summarize_config_cleanup: configured_target
# - reconcile_config_guardrails and verify_config_cleanup: region
targets:
  - name: organization-config-cleanup
    provider:
      name: aws
      mode: organization
      options:
        profile: delegated-admin-security
        role_name: OrganizationAccountAccessRole
    regions:
      - us-east-1
      - us-west-2
    max_workers: 4
    max_parallel_regions: 2
    dry_run: true
    tasks:
      # Omitted id defaults to the component name.
      - name: snapshot_org_config

      # The same component is configured twice, so both uses have explicit IDs.
      # The configured-target snapshot fans out to every selected account-region.
      - id: detach_guardrails
        name: reconcile_config_guardrails
        depends_on:
          - snapshot_org_config
        metadata:
          attachment_state: absent
        dependency_data:
          organization_snapshot:
            task_id: snapshot_org_config

      - id: verify_cleanup
        name: verify_config_cleanup
        depends_on:
          - detach_guardrails
        dependency_data:
          detach_result:
            task_id: detach_guardrails
            path: result

      # Cleanup runs after a success, error, interruption, or skip. A producer that
      # raises TaskExecutionError can preserve result.attachments for restoration.
      - id: restore_guardrails
        name: reconcile_config_guardrails
        depends_on:
          - detach_guardrails
        always_run: true
        metadata:
          attachment_state: present
        dependency_data:
          attachments:
            task_id: detach_guardrails
            path: result.attachments

      # Region results fan in to this configured-target summary in configured
      # account and region order.
      - name: summarize_config_cleanup
        depends_on:
          - verify_cleanup
          - restore_guardrails
        dependency_data:
          verification_results:
            task_id: verify_cleanup
            path: result
          restoration_task_results:
            task_id: restore_guardrails

    post_run:
      - processor: html_report
        output: organization-config-cleanup.html
        run_on_failure: true
