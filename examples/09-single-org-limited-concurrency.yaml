# Demonstrates:
# - Limiting parallel account execution
#
# Builds on 08 by adding a worker limit for account concurrency.

schema_version: 1

organizations:
  - name: limited-concurrency-org

    profile: my-aws-profile

    exclude:
      - "333333333333"
      - "444444444444"

    max_workers: 3
    # Number of accounts processed concurrently

    tasks:
      - name: inventory

      - name: tagging
        depends_on: ["inventory"]

      - name: compliance
        depends_on: ["inventory"]
        optional: true

      - name: cleanup
        depends_on: ["tagging", "compliance"]
