schema_version: 2
targets:

- name: github-repo-security-audit
  provider:
    name: github
    mode: repositories
    options:
      token_env: GITHUB_TOKEN
  regions:
  - global
  include:
  - octo-org/example
  dry_run: true
  metadata:
    state: open
    branch: main
    max_results: 100
  tasks:
  - name: list_code_scanning_alerts
  - name: list_secret_scanning_alerts
  - name: list_dependabot_alerts
  - name: audit_branch_protection
  - name: audit_rulesets
  - name: audit_repo_security_settings

- name: github-owner-repository-security-audit
  provider:
    name: github
    mode: organizations
    options:
      app_id: "12345"
      private_key_env: GITHUB_APP_PRIVATE_KEY
  regions:
  - global
  include:
  - octo-org
  - octocat
  dry_run: true
  metadata:
    state: open
    branch: main
    max_results: 100
  tasks:
  - name: list_code_scanning_alerts
  - name: list_secret_scanning_alerts
  - name: list_dependabot_alerts
  - name: audit_branch_protection
  - name: audit_rulesets
  - name: audit_repo_security_settings
