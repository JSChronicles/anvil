schema_version: 2
targets:
- name: aws-organization-include
  provider:
    name: aws
    mode: organization
    options:
      profile: org-root
  regions:
  - us-east-1
  include:
  - '111111111111'
  - '222222222222'
  dry_run: true
  tasks:
  - name: count_vpc

- name: aws-organization-exclude
  provider:
    name: aws
    mode: organization
    options:
      profile: org-root
  regions:
  - us-east-1
  exclude:
  - '999999999999'
  dry_run: true
  tasks:
  - name: count_vpc
