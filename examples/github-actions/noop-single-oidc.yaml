schema_version: 2
max_parallel_targets: 1
targets:
  - name: single-oidc-org
    provider:
      name: aws
      mode: organization
      options:
        role_name: OrganizationAccountAccessRole
    regions:
      - us-east-1
    max_workers: 10
    fail_fast: false
    dry_run: true
    tasks:
      - name: noop
