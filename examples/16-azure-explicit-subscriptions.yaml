schema_version: 1

accounts:
  - name: azure-explicit-subscriptions
    provider: azure
    mode: subscriptions
    # Azure/GCP configs currently validate provider shape only. anvil run and
    # validate --auth reject non-AWS providers until runtime dispatch is wired.
    regions:
      - eastus
    include:
      # Azure currently supports explicit subscription IDs only. Management
      # group discovery is intentionally deferred.
      - 11111111-2222-3333-4444-555555555555
      - aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    provider_options:
      # Accepted as a future runtime placeholder; not used by anvil run yet.
      tenant_id: example-tenant-id
    dry_run: true
    tasks:
      - name: noop
