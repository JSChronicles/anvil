schema_version: 1

accounts:
  - name: azure-explicit-subscriptions
    provider: azure
    mode: subscriptions
    # This example uses explicit subscription IDs. Omit include to discover
    # visible subscriptions. Runtime requires Azure optional SDKs and credentials.
    regions:
      - eastus
    include:
      # This example lists subscription IDs directly. Management group
      # discovery is intentionally deferred.
      - 11111111-2222-3333-4444-555555555555
      - aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    provider_options:
      tenant_id: example-tenant-id
      client_id: example-client-id
      client_secret: example-client-secret
      subscription_id: example-runtime-subscription-id
    dry_run: true
    tasks:
      - name: noop
