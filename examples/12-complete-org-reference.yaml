schema_version: 1
max_parallel_targets: 2

organizations:
  - name: place
    profile: place-root
    regions:
      - us-east-1
      - us-west-2
    role_name: OrganizationAccountAccessRole

    max_workers: 5
    max_parallel_regions: 2
    fail_fast: false
    dry_run: true

    include:
      - "111111111111"
      - "222222222222"

    tasks:
      - name: discover_iam_users

      - name: backup_iam_users
        depends_on:
          - discover_iam_users

      - name: remove_iam_user
        depends_on:
          - discover_iam_users
          - backup_iam_users

    metadata:
      user_name: test

  - name: audit
    profile: audit-root
    regions:
      - us-west-2
    role_name: OrganizationAccountAccessRole

    max_workers: 10
    max_parallel_regions: 1
    fail_fast: true
    dry_run: false

    exclude:
      - "333333333333"

    tasks:
      - name: inventory_resources

      - name: validate_security_baseline
        depends_on:
          - inventory_resources

      - name: report_findings
        depends_on:
          - inventory_resources
          - validate_security_baseline
        optional: true

    metadata:
      owner: security
