schema_version: 1
max_parallel_targets: 2

accounts:
  - name: app-team
    profile: team-base
    # Account configs require explicit region names.
    regions:
      - us-east-1
    role_name: TeamExecutionRole
    include:
      - "333333333333"
      - "444444444444"
    tasks:
      - name: noop
    max_workers: 10
    max_parallel_regions: 1
    fail_fast: false
    dry_run: false
    metadata:
      owner: app-team
      environment: production
