# Demonstrates:
# - Executing multiple organizations in a single run
# - Independent auth, regions, and execution contexts
#
# Builds on 09 by adding a second organization.

schema_version: 1

organizations:
  - name: primary-org
    profile: primary-profile
    region: us-east-1

    exclude:
      - "333333333333"
      - "444444444444"

    max_workers: 3

    tasks:
      - name: inventory

      - name: tagging
        depends_on: ["inventory"]

      - name: compliance
        depends_on: ["inventory"]
        optional: true

      - name: cleanup
        depends_on: ["tagging", "compliance"]

  - name: secondary-org
    profile: secondary-profile
    region: us-west-2

    exclude:
      - "555555555555"

    max_workers: 3

    tasks:
      - name: inventory

      - name: tagging
        depends_on: ["inventory"]

      - name: compliance
        depends_on: ["inventory"]
        optional: true

      - name: cleanup
        depends_on: ["tagging", "compliance"]
