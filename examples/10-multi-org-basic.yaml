schema_version: 2
max_parallel_targets: 2
targets:
- name: primary-org
  provider:
    name: aws
    mode: organization
    options:
      profile: primary-profile
  regions:
  - us-east-1
  - us-west-2
  exclude:
  - '333333333333'
  - '444444444444'
  max_workers: 3
  tasks:
  - name: inventory
  - name: tagging
    depends_on:
    - inventory
  - name: compliance
    depends_on:
    - inventory
    optional: true
  - name: cleanup
    depends_on:
    - tagging
    - compliance
- name: secondary-org
  provider:
    name: aws
    mode: organization
    options:
      profile: secondary-profile
  regions:
  - us-west-2
  exclude:
  - '555555555555'
  max_workers: 3
  tasks:
  - name: inventory
  - name: tagging
    depends_on:
    - inventory
  - name: compliance
    depends_on:
    - inventory
    optional: true
  - name: cleanup
    depends_on:
    - tagging
    - compliance
